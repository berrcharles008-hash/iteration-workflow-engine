# =============================================================================
# iteration-workflow Skill — 门禁回归测试矩阵
# =============================================================================
# 版本: v1.0
# 日期: 2026-07-23
# 用途: 驱动人工/脚本执行门禁行为验证，让评分从"文档分析"升级为"实测验证"
# 执行: 逐用例 [case.*] 手动操作 → 填写 actual 字段 → 汇总通过率
# 覆盖层: L3（Hook 层，gate-check.mjs PreToolUse）为主，附录含 L1/L2 prompt 层
# 参考: engine/gate-decision-table.md（门禁决策表 S0~S7）
# =============================================================================

# ── 执行说明 ─────────────────────────────────────────────────────────────────
# 每用例执行步骤：
#   1. 按 setup 要求配置环境（ACTIVE / state.yaml / 上下文）
#   2. 触发目标工具调用（见 setup.tool / setup.file_path）
#   3. 观察 Hook 输出（stdout/stderr）与工具执行结果
#   4. 将实际 exit_code 与行为填入 actual 字段
#   5. actual.passed = (actual.exit_code == expect.exit_code)
#
# 环境变量选项：
#   GATE_BYPASS=1            → 跳过所有门禁
#   GATE_TEST_RUNTIME_DIR=.. → 使用指定 runtime 目录（测试隔离）
# =============================================================================

# 全局执行上下文
[meta]
skill_path = ".claude/skills/iteration-workflow/"
# hook_script 由 run-gate-tests.mjs 根据环境变量自动检测：
#   CODEBUDDY_PROJECT_DIR → .codebuddy/hooks/gate-check.mjs
#   否则 → .claude/hooks/gate-check.mjs
project_dir = "e:/workspace/示例工程/temp-branch"
test_iteration_id = "2026-07-23-020-S1门禁自动化回归测试矩阵"
execution_date = "2026-07-23"
executor = "run-gate-tests.mjs (L3)/手动 (L1/L2/并发)"

# =============================================================================
# 一、L3 Hook 层主测试（10 用例）
# =============================================================================
# 对应 gate-decision-table.md §一 S0~S7，验证 gate-check.mjs 实际行为

# ── S0: 正常放行（04阶段 + 业务代码） ───────────────────────────────────────
[[case]]
id = "S0"
level = "L3-hook"
name = "04阶段写业务代码 → 放行"
decision_table = "S0"
description = """
当前激活迭代处于 04-开发实现 阶段，写入 src/ 下的业务代码文件，
Hook 应无条件放行（exit 0），工具正常执行。
这是开发窗口的核心保证——若此用例失败，所有 04 开发工作流不可用。
"""
[case.setup]
active = "2026-07-23-020-S1门禁自动化回归测试矩阵"
phase = "04"
tool = "replace_in_file"
file_path = "front-end/my-app_upgrade/src/pages/example/example_page.ts"
stdin_type = "normal"
gate_bypass = false
[case.expect]
exit_code = 0
block = false
tool_executes = true
[case.actual]
exit_code = 0
passed = true
note = "已在实际执行中验证：迭代 019 第 5 步 04阶段写入 demo.vue → 放行通过"

# ── S1: 无活跃迭代 ─────────────────────────────────────────────────────────
[[case]]
id = "S1"
level = "L3-hook"
name = "无活跃迭代写业务代码 → 阻止"
decision_table = "S1"
description = """
ACTIVE = "none"（无活跃迭代），尝试写入业务代码。
Hook 应拦截（exit 2），输出"当前无活跃迭代"提示框。
"""
[case.setup]
active = "none"
phase = ""
tool = "write_to_file"
file_path = "front-end/my-app_upgrade/src/test.js"
stdin_type = "normal"
gate_bypass = false
[case.expect]
exit_code = 2
block = true
tool_executes = false
[case.actual]
exit_code = 2
passed = true
note = "run-gate-tests.mjs 验证：exit 2，阻止成功"

