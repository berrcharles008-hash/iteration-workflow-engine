# =============================================================================
# 二、并发 / 锁测试（3 用例） — 对应路线图 T1~T3
# =============================================================================
# 需要两个独立进程/会话，或模拟两个 stdin 输入

[[case]]
id = "T1"
level = "L3-concurrency"
name = "双会话并发写 state.yaml → 至少一端有锁冲突"
description = """
两个 Agent 会话同时写入同一 state.yaml。
期望至少一端因文件锁冲突而写入失败或接到冲突提示。
当前实现（F03 原子锁 + TTL 60s）应保证不会静默覆盖。
执行方式：在两个终端中几乎同时执行 'echo "phase:04" > state.yaml'。
"""
[case.setup]
active = "2026-07-23-020-S1门禁自动化回归测试矩阵"
phase = "04"
concurrent_sessions = 2
target_file = ".claude/skills/iteration-workflow/runtime/2026-07-23-020-S1门禁自动化回归测试矩阵.state.yaml"
[case.expect]
lock_conflict = true
data_corruption = false
[case.actual]
executed = false
passed = false
note = "需要双会话环境，暂未执行"

[[case]]
id = "T2"
level = "L3-concurrency"
name = "清理残留锁文件 → 正常恢复"
description = """
模拟上一会话崩溃后残留锁文件（runtime/.lock 或类似），
新会话能否正常检测并清理，然后获取锁。
"""
[case.setup]
active = "2026-07-23-020-S1门禁自动化回归测试矩阵"
phase = "04"
stale_lock = true
[case.expect]
lock_cleared = true
session_recovered = true
[case.actual]
executed = false
passed = false
note = "需确认 runtime/.lock 的实际机制"

[[case]]
id = "T3"
level = "L3-concurrency"
name = "锁超过 TTL(60s) → 新会话可获取"
description = """
锁持有超过 60 秒 TTL 后，新会话应能检测到超时并获取锁。
验证 TTL 过期逻辑正确，不会永久死锁。
"""
[case.setup]
active = "2026-07-23-020-S1门禁自动化回归测试矩阵"
phase = "04"
lock_age = ">60s"
[case.expect]
new_session_lock = true
stale_lock_released = true
[case.actual]
executed = false
passed = false
note = "需确认 TTL 机制实现"

