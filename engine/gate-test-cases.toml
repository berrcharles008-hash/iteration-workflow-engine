# ── S4: fail-open 确认（空 stdin） ─────────────────────────────────────────
[[case]]
id = "S4"
level = "L3-hook"
name = "空 stdin 输入 → 当前行为确认"
decision_table = "—（未覆盖）"
description = """
Hook 收到空 stdin 时的实际行为——根据源码第 72-74 行，当前行为是 exit(0) 放行。
这属于 fail-open 设计：异常/空输入不应放行门禁。
本用例旨在记录当前实际行为，为 S2 修复提供基线对比。
"""
[case.setup]
active = "none"
phase = ""
tool = "write_to_file"
file_path = "front-end/my-app_upgrade/src/test.js"
stdin_type = "empty"
gate_bypass = false
[case.expect]
exit_code = 2 # 期望行为（修复后）: 空输入应阻止
block = true
tool_executes = false
[case.actual]
exit_code = 2
passed = true
note = "S2 修复后验证：exit 2，fail-closed 生效，空 stdin 正确拦截"

# ── S5: fail-open 确认（畸形 JSON） ────────────────────────────────────────
[[case]]
id = "S5"
level = "L3-hook"
name = "畸形 JSON stdin → 当前行为确认"
decision_table = "—（未覆盖）"
description = """
Hook 收到格式错误 JSON 时的实际行为——源码第 84-86 行，JSON 解析失败 → exit(0)。
同 S4，属于 fail-open 设计。
"""
[case.setup]
active = "none"
phase = ""
tool = "write_to_file"
file_path = "front-end/my-app_upgrade/src/test.js"
stdin_type = "malformed_json"
gate_bypass = false
[case.expect]
exit_code = 2 # 期望行为（修复后）: 畸形输入应阻止
block = true
tool_executes = false
[case.actual]
exit_code = 2
passed = true
note = "S2 修复后验证：exit 2，fail-closed 生效，畸形 JSON 正确拦截"

